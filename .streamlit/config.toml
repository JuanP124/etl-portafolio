[server]
# Solo accesible desde este computador (punto 2 del checklist)
address = "localhost"
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
# No mostrar errores técnicos en el navegador (punto 8)
showErrorDetails = "none"
toolbarMode = "viewer"

[theme]
base = "dark"
primaryColor = "#8B5CF6"
backgroundColor = "#0B0B14"
secondaryBackgroundColor = "#14141F"
textColor = "#E6E6F0"
font = "sans serif"